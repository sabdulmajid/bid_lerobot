run:
  id: polydistill_pusht_collect_8x16
  output_dir: outputs/polyppo/pusht_polydistill_dataset_8x16
  seed: 190000
  device: cuda
  gpu_id: 0

policy:
  path: ${oc.env:POLYPPO_POLICY_PATH,lerobot/vqbet_pusht}
  temperature: 0.7

env:
  episode_length: 300

distill:
  mock: false
  n_start_states: 8
  attempts_per_start: 16
  max_steps: 300
  select_by: success_then_overlap
