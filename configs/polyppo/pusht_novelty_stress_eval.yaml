run:
  id: polyppo_pusht_novelty_stress_eval
  output_dir: outputs/polyppo/pusht_novelty_stress_eval
  seed: 170000
  device: cuda
  gpu_id: 1

policy:
  path: ${oc.env:POLYPPO_POLICY_PATH,lerobot/vqbet_pusht}
  temperature: 0.7

checkpoints:
  - name: ppo_no_diversity_32x8
    checkpoint_path: outputs/polyppo/pusht_novelty_ppo_32x8/checkpoint.pt
  - name: polyppo_code_diversity_32x8
    checkpoint_path: outputs/polyppo/pusht_novelty_polyppo_code_32x8/checkpoint.pt

stress:
  variants:
    - name: standard
      action_noise_std: 0.0
      observation_noise_std: 0.0
    - name: action_noise
      action_noise_std: 0.03
      observation_noise_std: 0.0
    - name: observation_noise
      action_noise_std: 0.0
      observation_noise_std: 0.03
  pass_at_k: [1, 2, 4, 8]
  eval_episodes: 50
  eval_batch_size: 50
