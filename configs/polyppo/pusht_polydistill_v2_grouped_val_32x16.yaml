  output_dir: /pub7/neel2/polyppo_runs/pusht_polydistill_v2_grouped_val_32x16
  seed: 240000
  device: cuda
  gpu_id: 0

policy:
  path: ${oc.env:POLYPPO_POLICY_PATH,lerobot/vqbet_pusht}
  temperature: 0.7

env:
  episode_length: 300

checkpoints:
  - name: direct_vqbet
    checkpoint_path:
  - name: ppo_no_diversity
    checkpoint_path: outputs/polyppo/pusht_novelty_ppo_32x8/checkpoint.pt
  - name: polydistill_v1_topset_8x16
    checkpoint_path: outputs/polyppo/pusht_polydistill_topset_8x16/checkpoint.pt
  - name: v2_top1_ce_64x16
    checkpoint_path: /pub7/neel2/polyppo_runs/pusht_polydistill_v2_top1_ce_64x16/checkpoint.pt
  - name: v2_topm4_tau007_kl001_64x16
    checkpoint_path: /pub7/neel2/polyppo_runs/pusht_polydistill_v2_topm4_tau007_kl001_64x16/checkpoint.pt
  - name: v2_success_soft_m4_tau007_kl001_64x16
    checkpoint_path: /pub7/neel2/polyppo_runs/pusht_polydistill_v2_success_soft_m4_tau007_kl001_64x16/checkpoint.pt
  - name: v2_adv_m4_tau05_kl001_64x16
    checkpoint_path: /pub7/neel2/polyppo_runs/pusht_polydistill_v2_adv_m4_tau05_kl001_64x16/checkpoint.pt

grouped_passk:
  n_start_states: 32
  attempts_per_start: 16
  same_start_states_across_methods: true
  max_steps: 300
  pass_at_k: [1, 2, 4, 8, 16]
  validate_profile: benchmark

