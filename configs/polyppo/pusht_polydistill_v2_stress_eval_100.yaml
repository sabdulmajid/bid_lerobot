run:
  id: polydistill_v2_stress_eval_100
  output_dir: /pub7/neel2/polyppo_runs/pusht_polydistill_v2_stress_eval_100
  seed: 260000
  device: cuda
  gpu_id: 0

policy:
  path: ${oc.env:POLYPPO_POLICY_PATH,lerobot/vqbet_pusht}
  temperature: 0.7

checkpoints:
  - name: direct_vqbet
    checkpoint_path:
  - name: ppo_no_diversity
    checkpoint_path: outputs/polyppo/pusht_novelty_ppo_32x8/checkpoint.pt
  - name: v2_topm4_tau007_kl001_64x16
    checkpoint_path: /pub7/neel2/polyppo_runs/pusht_polydistill_v2_topm4_tau007_kl001_64x16/checkpoint.pt

stress:
  variants:
    - name: action_noise_0p05
      action_noise_std: 0.05
      observation_noise_std: 0.0
    - name: observation_noise_0p02
      action_noise_std: 0.0
      observation_noise_std: 0.02
  same_seed_across_checkpoints: true
  pass_at_k: [1]
  eval_episodes: 100
  eval_batch_size: 50

